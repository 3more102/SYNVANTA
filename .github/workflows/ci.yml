name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSYNVANTA_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: AIG CLI smoke test
        run: ./build/synvanta aig examples/half_adder.sv

      - name: Generic Verilog CLI smoke test
        run: ./build/synvanta emit-verilog examples/half_adder.sv | grep -q endmodule
